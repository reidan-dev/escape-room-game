<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cure Line — QR</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 210mm;
    height: 297mm;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    color: #111;
  }
  .card {
    text-align: center;
  }
  .card h1 {
    font-size: 30px;
    letter-spacing: 2px;
    margin: 0 0 6px;
  }
  .card .sub {
    font-size: 13px;
    font-style: italic;
    color: #444;
    margin-bottom: 28px;
  }
  .card img {
    width: 70mm;
    height: 70mm;
    border: 10px solid #fff;
    outline: 1px solid #ccc;
  }
  .card .url {
    margin-top: 22px;
    font-size: 12px;
    color: #555;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>ANG DAILY CHISMIS</h1>
    <div class="sub">Scan to reach the Cure Line</div>
    <img src="qr_code.png" alt="QR code">
    <div class="url">https://reidan-dev.github.io/escape-room-game/</div>
  </div>
</body>
</html>
